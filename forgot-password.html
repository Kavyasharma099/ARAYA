<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARAYA — Password Recovery</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="auth-shell"><section class="auth-card"><div class="brand">ARAYA</div><p class="eyebrow">ACCOUNT RECOVERY</p><h1>Reset your password</h1><p class="muted">Enter your registered mobile or email. A verification code will be sent through the configured authorized OTP provider.</p><form id="recoveryForm"><label>Mobile / Email<input id="recoveryId" required></label><button type="submit">SEND OTP</button><p id="message" class="message"></p></form><a class="back" href="/login.html">← Back to login</a></section></main><script>document.getElementById('recoveryForm').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('message');m.textContent='Sending request...';try{const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:document.getElementById('recoveryId').value})});const d=await r.json();m.textContent=d.message||'Request submitted.'}catch{m.textContent='Unable to contact the ARAYA server.'}});</script></body></html>
